<div class="container">

<h1>Travel Itinerary Planner</h1>

<label>Destination</label>
<select id="destination">
    <option>Goa</option>
    <option>Manali</option>
    <option>Kerala</option>
    <option>Ooty</option>
    <option>Jaipur</option>
    <option>Paris</option>
</select>

<label>Number of Days</label>
<input type="number" id="days" min="1" value="3">

<label>Travel Date</label>
<input type="date" id="date">

<label>Number of Travelers</label>
<input type="number" id="travelers" min="1" value="2">

<button onclick="generatePlan()">Generate Itinerary</button>

<div id="result"></div>

</div>

<div id="result"></div>
<hr style="margin:40px 0;">

<h1>Trip Budget Estimation</h1>


<button onclick="calculateBudget()">
    Calculate Estimated Budget
</button>

<div id="budgetResult"></div>

<script>

const itineraries = {

Goa:[
"Day 1: Arrival, Calangute Beach & Sunset",
"Day 2: Fort Aguada, Baga Beach & Water Sports",
"Day 3: Dudhsagar Falls & Spice Plantation",
"Day 4: Old Goa Churches & River Cruise",
"Day 5: Shopping at Panjim & Departure"
],

Manali:[
"Day 1: Arrival & Mall Road",
"Day 2: Solang Valley Adventure",
"Day 3: Rohtang Pass Excursion",
"Day 4: Hadimba Temple & Local Market",
"Day 5: Departure"
],

Kerala:[
"Day 1: Kochi Sightseeing",
"Day 2: Munnar Tea Gardens",
"Day 3: Thekkady Wildlife Sanctuary",
"Day 4: Alleppey Houseboat Cruise",
"Day 5: Kovalam Beach & Departure"
],

Ooty:[
"Day 1: Botanical Garden & Lake",
"Day 2: Doddabetta Peak & Tea Museum",
"Day 3: Toy Train Ride",
"Day 4: Pykara Falls & Boating",
"Day 5: Shopping & Departure"
],

Jaipur:[
"Day 1: City Palace & Hawa Mahal",
"Day 2: Amber Fort & Jal Mahal",
"Day 3: Jantar Mantar & Shopping",
"Day 4: Nahargarh Fort",
"Day 5: Departure"
],

Paris:[
"Day 1: Eiffel Tower & Seine Cruise",
"Day 2: Louvre Museum & Notre-Dame",
"Day 3: Palace of Versailles",
"Day 4: Champs-Élysées & Arc de Triomphe",
"Day 5: Shopping & Departure"
]

};

function generatePlan(){

let destination=document.getElementById("destination").value;
let days=parseInt(document.getElementById("days").value);
let date=document.getElementById("date").value;
let travelers=document.getElementById("travelers").value;

let schedule=itineraries[destination];

let output="<h2>Your Travel Plan</h2>";

output+="<p><strong>Destination:</strong> "+destination+"</p>";
output+="<p><strong>Travel Date:</strong> "+date+"</p>";
output+="<p><strong>Travelers:</strong> "+travelers+"</p>";

output+="<h3>Suggested Itinerary</h3><ul>";

for(let i=0;i<days && i<schedule.length;i++){
    output+="<li>"+schedule[i]+"</li>";
}

output+="</ul>";

document.getElementById("result").innerHTML=output;

}

function calculateBudget() {

    let destination = document.getElementById("destination").value;
    let days = parseInt(document.getElementById("days").value);
    let people = parseInt(document.getElementById("travelers").value);

    // Prices for each destination
    const prices = {
        "Goa": {
            hotel: 2500,
            food: 900,
            transport: 1500
        },
        "Manali": {
            hotel: 3000,
            food: 800,
            transport: 2000
        },
        "Kerala": {
            hotel: 2800,
            food: 850,
            transport: 1800
        },
        "Ooty": {
            hotel: 2200,
            food: 700,
            transport: 1200
        },
        "Jaipur": {
            hotel: 2600,
            food: 750,
            transport: 1500
        },
        "Paris": {
            hotel: 12000,
            food: 3500,
            transport: 5000
        }
    };

    let hotelCost = prices[destination].hotel * days;
    let foodCost = prices[destination].food * days * people;
    let transportCost = prices[destination].transport;

    let totalCost = hotelCost + foodCost + transportCost;

    document.getElementById("budgetResult").innerHTML = `
        <h2>Estimated Budget for ${destination}</h2>
        <p><strong>Hotel:</strong> ₹${prices[destination].hotel}/day × ${days} days = ₹${hotelCost.toLocaleString()}</p>
        <p><strong>Food:</strong> ₹${prices[destination].food}/person/day × ${people} travelers × ${days} days = ₹${foodCost.toLocaleString()}</p>
        <p><strong>Transport:</strong> ₹${transportCost.toLocaleString()}</p>
        <hr>
        <h2 style="color:#f18407;">
            Total Estimated Cost: ₹${totalCost.toLocaleString()}
        </h2>
    `;
}

</script>
