/* Contact Section */
#contact {
    max-width: 650px;
    margin: 80px auto;
    padding: 35px;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

#contact h1 {
    text-align: center;
    font-size: 42px;
    color: #2f2d45;
    margin-bottom: 10px;
}

#contact p {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
    font-size: 17px;
}

#contact form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

#contact input,
#contact textarea {
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.75);
    outline: none;
    font-family: 'Poppins', sans-serif;
}

#contact textarea {
    resize: vertical;
}

#contact button {
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 10px;
    background: #f18407;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

#contact button:hover {
    background: #d96f00;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
}
